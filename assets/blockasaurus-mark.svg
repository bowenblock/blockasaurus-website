<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-label="Blockasaurus mark">
  <!-- Voxel T-rex, 16x16 grid, facing right. Forest dino green + cream belly + warm black details. -->

  <!-- Body, head, tail, legs (green) -->
  <g fill="#2f7a44">
    <!-- Tail (left side, sloping up to body) -->
    <rect x="0" y="9" width="2" height="1"/>
    <rect x="1" y="8" width="2" height="1"/>
    <rect x="2" y="7" width="2" height="1"/>
    <!-- Body -->
    <rect x="3" y="6" width="6" height="1"/>
    <rect x="2" y="7" width="8" height="1"/>
    <rect x="2" y="8" width="9" height="1"/>
    <rect x="2" y="9" width="9" height="1"/>
    <rect x="3" y="10" width="7" height="1"/>
    <!-- Neck -->
    <rect x="9" y="5" width="2" height="1"/>
    <!-- Head -->
    <rect x="10" y="2" width="4" height="1"/>
    <rect x="9" y="3" width="6" height="1"/>
    <rect x="9" y="4" width="6" height="1"/>
    <rect x="10" y="5" width="4" height="1"/>
    <!-- Snout (extends right) -->
    <rect x="13" y="3" width="2" height="2"/>
    <!-- Lower jaw -->
    <rect x="10" y="6" width="3" height="1"/>
    <!-- Legs -->
    <rect x="3" y="11" width="2" height="2"/>
    <rect x="7" y="11" width="2" height="2"/>
    <!-- Feet -->
    <rect x="2" y="13" width="4" height="1"/>
    <rect x="6" y="13" width="4" height="1"/>
    <!-- Tiny arm -->
    <rect x="8" y="7" width="1" height="2"/>
  </g>

  <!-- Cream belly + teeth -->
  <g fill="#f5e7b8">
    <rect x="4" y="9" width="5" height="1"/>
    <rect x="5" y="10" width="3" height="1"/>
    <!-- Teeth in open mouth -->
    <rect x="11" y="5" width="1" height="1"/>
    <rect x="13" y="5" width="1" height="1"/>
  </g>

  <!-- Mouth gap (between upper + lower jaw) -->
  <g fill="#0d1410">
    <rect x="10" y="5" width="1" height="1"/>
    <rect x="12" y="5" width="1" height="1"/>
    <!-- Eye -->
    <rect x="12" y="3" width="1" height="1"/>
  </g>
</svg>
